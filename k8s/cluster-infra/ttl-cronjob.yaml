apiVersion: v1
kind: ServiceAccount
metadata:
  name: namespace-cleaner
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-cleaner-role
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: namespace-cleaner-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: namespace-cleaner-role
subjects:
  - kind: ServiceAccount
    name: namespace-cleaner
    namespace: default
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ephemeral-env-cleaner
  namespace: default
spec:
  schedule: "0 * * * *" # Run every hour
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: namespace-cleaner
          containers:
            - name: cleaner
              image: alpine:latest
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache curl jq
                  curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                  chmod +x kubectl
                  mv kubectl /usr/local/bin/
                  
                  # Find all namespaces starting with "pr-" older than 24 hours (86400 seconds)
                  kubectl get namespaces -o json | \
                  jq -r '.items[] | select(.metadata.name | startswith("pr-")) | select((now - (.metadata.creationTimestamp | fromdateiso8601)) > 86400) | .metadata.name' | \
                  xargs -r kubectl delete namespace
          restartPolicy: OnFailure
