apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devboard-ingress
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.middlewares: pr-0-basic-auth@kubernetescrd
spec:
  rules:
    - host: pr-0.local.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devboard-app
                port:
                  number: 80
