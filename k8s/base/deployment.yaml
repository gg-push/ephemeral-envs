apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard
  template:
    metadata:
      labels:
        app: devboard
    spec:
      containers:
        - name: app
          image: ghcr.io/yourusername/ephemeral-envs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/devboard
            - name: ENV_NAME
              value: "pr-0"
            - name: PR_NUMBER
              value: "0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
