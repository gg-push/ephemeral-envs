apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
spec:
  hard:
    # Max total CPU and Memory allowed across all pods in this PR namespace
    limits.cpu: "1000m"
    limits.memory: "1Gi"
    # Max total CPU and Memory that can be requested
    requests.cpu: "400m"
    requests.memory: "512Mi"
    # Max number of pods allowed (App + DB)
    pods: "5"
