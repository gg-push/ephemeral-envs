# Root deployment project.
#
# No kustomization.yaml files are committed under deploy/. kluctl generates one
# automatically for any directory that lacks it, so each directory is just the
# manifests it owns.

deployments:
  # The namespace has to exist before anything can be placed inside it, so this
  # is the one place a barrier is genuinely required.
  - path: deploy/namespace
  - barrier: true
    message: Waiting for the preview namespace

  - path: deploy/networkpolicy
  - path: deploy/postgres

  # Postgres has no build step, so it starts while this waits. The app
  # deployments are only updated once their images exist, so a push never
  # rolls out to ImagePullBackOff.
  - path: deploy/wait-for-images
  - barrier: true
    message: Waiting for CI to publish this commit's images

  - path: deploy/backend
  - path: deploy/frontend
  - path: deploy/ingress

# Applied to every object kluctl deploys. These are what make an environment
# identifiable from kubectl and k9s without having to parse the namespace
# name.
commonLabels:
  app.kubernetes.io/managed-by: kluctl
  ephemeral-env: "true"
  pr-number: "{{ args.pr_number }}"

commonAnnotations:
  ephemeral-envs/image-tag: "{{ args.image_tag }}"
