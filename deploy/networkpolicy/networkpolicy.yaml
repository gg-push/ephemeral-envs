apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: env-isolation
  namespace: "pr-{{ args.pr_number }}"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow intra-namespace traffic (frontend/backend <-> postgres)
    - from:
        - podSelector: {}
    # Allow Traefik ingress controller to reach backend (8000) and frontend (8080)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
  egress:
    # Allow intra-namespace traffic only (blocks cross-PR database access)
    - to:
        - podSelector: {}
    # Allow cluster DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# NetworkPolicies are additive, so this grants one extra path to one pod: the
# build-gate Job may reach the registry over HTTPS to check whether this
# commit's images exist. Every other pod stays confined by env-isolation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: image-wait-egress
  namespace: "pr-{{ args.pr_number }}"
spec:
  podSelector:
    matchLabels:
      app: image-wait
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
