name: Cleanup Ephemeral Environment

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Destroy Kubernetes Resources
        run: |
          # Deleting the namespace automatically cascades and deletes all resources inside it
          kubectl delete namespace pr-${{ github.event.pull_request.number }} --ignore-not-found

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Ephemeral Environment destroyed.** \n\nThe namespace and all associated resources have been successfully cleaned up.'
            })
