name: Build Preview Images

# Builds and publishes images. That is all.
#
# Nothing here deploys, and nothing here needs a machine of yours — this runs
# on GitHub-hosted runners. Deployment, teardown and the PR comment are all
# owned by controllers inside the cluster.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # A fork's GITHUB_TOKEN is read-only, so it could not push anyway. Being
    # explicit keeps the failure mode obvious rather than a confusing 403, and
    # mirrors the `head` filter on ListGithubPullRequests which stops fork
    # branches becoming environments.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Required for cache-to: type=gha. The default buildx driver is `docker`,
      # which cannot export a cache; this switches to `docker-container`.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the head SHA because that is exactly what the ObjectTemplate
      # passes as image_tag. If the two ever disagree the environment sits in
      # ImagePullBackOff, which is loud and obvious.
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ephemeral-envs-backend:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ephemeral-envs-frontend:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
