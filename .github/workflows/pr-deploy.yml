name: Deploy Ephemeral Environment

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ephemeral-envs:pr-${{ github.event.pull_request.number }}

      - name: Deploy to Local K3d Cluster
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/ephemeral-envs:pr-${{ github.event.pull_request.number }}
        run: |
          # Generate a random 12-character password and hash it using Python
          # We use crypt for the hash which Nginx Ingress natively supports
          AUTH_SCRIPT="import string, random, crypt; pw=''.join(random.choices(string.ascii_letters + string.digits, k=12)); hashed=crypt.crypt(pw, crypt.mksalt(crypt.METHOD_SHA512)); print(pw); print(f'admin:{hashed}')"
          
          # Run python script and store results
          RAW_OUTPUT=$(python3 -c "$AUTH_SCRIPT")
          PR_PASSWORD=$(echo "$RAW_OUTPUT" | head -n 1)
          AUTH_HASH=$(echo "$RAW_OUTPUT" | tail -n 1)
          
          # Pass the password to the next step so the bot can comment it
          echo "password=$PR_PASSWORD" >> "$GITHUB_OUTPUT"
          
          # 1. Create a dynamic Kustomize overlay for this specific PR
          mkdir -p k8s/overlays/pr-$PR_NUMBER
          
          cat <<EOF > k8s/overlays/pr-$PR_NUMBER/kustomization.yaml
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          
          resources:
            - ../../base
            
          namespace: pr-$PR_NUMBER
          namePrefix: pr-$PR_NUMBER-
          
          images:
            - name: ghcr.io/yourusername/ephemeral-envs
              newName: $IMAGE_TAG
              
          # Dynamically create the basic-auth secret containing our generated hash
          secretGenerator:
            - name: basic-auth
              literals:
                - auth='$AUTH_HASH'
              
          patches:
            - target:
                kind: Ingress
                name: devboard-ingress
              patch: |-
                - op: replace
                  path: /spec/rules/0/host
                  value: pr-$PR_NUMBER.127.0.0.1.nip.io
          EOF
          
          # 2. Ensure the namespace exists
          kubectl create namespace pr-$PR_NUMBER --dry-run=client -o yaml | kubectl apply -f -
          
          # 3. Apply the overlay to the cluster
          kubectl apply -k k8s/overlays/pr-$PR_NUMBER

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Ephemeral Environment is live!** \n\n**URL:** http://pr-${{ github.event.pull_request.number }}.127.0.0.1.nip.io \n**Username:** admin \n**Password:** ${{ steps.deploy.outputs.password }}'
            })
