name: Deploy Ephemeral Environment

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/ephemeral-envs:pr-${{ github.event.pull_request.number }}

      - name: Deploy to Local K3d Cluster
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/ephemeral-envs:pr-${{ github.event.pull_request.number }}
        run: |
          # Import the freshly built image directly into the local k3d cluster (bypasses GHCR auth issues)
          k3d image import $IMAGE_TAG -c ephemeral-envs
          
          # Generate a random 12-character password using standard bash utilities
          PR_PASSWORD=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 12 || true)
          
          # Use the official lightweight Apache Alpine container to generate the htpasswd hash
          AUTH_HASH=$(docker run --rm httpd:alpine htpasswd -nb admin "$PR_PASSWORD")
          
          # Pass the password to the next step so the bot can comment it
          echo "password=$PR_PASSWORD" >> "$GITHUB_OUTPUT"
          
          # 1. Create a dynamic Kustomize overlay for this specific PR
          mkdir -p k8s/overlays/pr-$PR_NUMBER
          
          cat <<EOF > k8s/overlays/pr-$PR_NUMBER/kustomization.yaml
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          
          resources:
            - ../../base
            
          namespace: pr-$PR_NUMBER
          namePrefix: pr-$PR_NUMBER-
          
          images:
            - name: ghcr.io/yourusername/ephemeral-envs
              newName: ghcr.io/${{ github.repository_owner }}/ephemeral-envs
              newTag: pr-$PR_NUMBER
              
          # Dynamically create the basic-auth secret containing our generated hash
          secretGenerator:
            - name: basic-auth
              literals:
                - auth='$AUTH_HASH'
              
          patches:
            - target:
                kind: Ingress
                name: devboard-ingress
              patch: |-
                - op: replace
                  path: /spec/rules/0/host
                  value: pr-$PR_NUMBER.127.0.0.1.nip.io
          EOF
          
          # 2. Ensure the namespace exists
          kubectl create namespace pr-$PR_NUMBER --dry-run=client -o yaml | kubectl apply -f -
          
          # 3. Apply the overlay to the cluster
          kubectl apply -k k8s/overlays/pr-$PR_NUMBER
          
          # 4. Wait for the application to actually be running before commenting
          kubectl rollout status deployment/pr-$PR_NUMBER-devboard-app -n pr-$PR_NUMBER --timeout=120s

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Ephemeral Environment is live!** \n\n**URL:** http://pr-${{ github.event.pull_request.number }}.127.0.0.1.nip.io \n**Username:** admin \n**Password:** ${{ steps.deploy.outputs.password }}'
            })
