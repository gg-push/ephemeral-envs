name: Preview Teardown Notice

# Teardown itself is not performed here. Closing the PR removes it from
# ListGithubPullRequests, the ObjectTemplate loses that matrix input, and the
# generated KluctlDeployment is pruned within about a minute.
#
# This workflow only corrects the sticky comment so the PR does not end with a
# URL that no longer resolves. It needs no cluster access, so unlike everything
# else it runs on a GitHub-hosted runner.

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ephemeral-env -->';
            const pr = context.payload.pull_request;
            const body = [
              marker,
              '### Preview environment removed',
              '',
              `\`pr-${pr.number}\` is no longer an open pull request, so the controller has pruned its environment.`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
