apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-panel-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-panel-role
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-panel-binding
subjects:
- kind: ServiceAccount
  name: control-panel-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: control-panel-role
  apiGroup: rbac.authorization.k8s.io
