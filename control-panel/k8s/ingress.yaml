apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control-panel-ingress
  namespace: default
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: traefik
  rules:
  - host: control.local.127.0.0.1.nip.io
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: control-panel-backend
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: control-panel-frontend
            port:
              number: 80
