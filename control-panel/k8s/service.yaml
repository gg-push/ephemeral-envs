apiVersion: v1
kind: Service
metadata:
  name: control-panel-backend
  namespace: default
spec:
  selector:
    app: control-panel-backend
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: control-panel-frontend
  namespace: default
spec:
  selector:
    app: control-panel-frontend
  ports:
  - port: 80
    targetPort: 80
