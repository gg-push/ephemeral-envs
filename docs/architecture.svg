<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 580" width="1140" height="580" role="img" aria-labelledby="title desc">
  <title id="title">Ephemeral Preview Environments Architecture</title>
  <desc id="desc">Pull-based GitOps architecture for ephemeral-envs showing GitHub PRs, GitHub Actions CI and multi-arch Buildx GHCR push, k3d reconciliation loop (ListGithubPullRequests, ObjectTemplate with 48h TTL, KluctlDeployment with prune and delete), and isolated per-PR namespace with NetworkPolicy, ResourceQuota, Traefik, non-root Frontend, FastAPI Backend, and Postgres 16.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#545B64"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#147EBA"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#248814"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Clean white diagram canvas -->
  <rect width="1140" height="580" fill="#FFFFFF"/>

  <g font-family="Helvetica, Arial, -apple-system, sans-serif">
    <!-- ==================== TOP LANE: GITHUB & CI ==================== -->
    <g transform="translate(30,44)">
      <rect width="98" height="72" rx="6" fill="#F8FAFC" stroke="#24292F" stroke-width="1.4"/>
      <circle cx="49" cy="24" r="6" fill="none" stroke="#24292F" stroke-width="1.8"/>
      <path d="M37 42 c0 -6.5 5.4 -10 12 -10 s12 3.5 12 10" fill="none" stroke="#24292F" stroke-width="1.8" stroke-linecap="round"/>
      <text x="49" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#232F3E">Developer</text>
    </g>

    <line x1="128" y1="80" x2="168" y2="80" stroke="#545B64" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="148" y="71" text-anchor="middle" font-size="9.5" fill="#545B64">PR</text>

    <g transform="translate(174,44)">
      <rect width="150" height="72" rx="6" fill="#FFFFFF" stroke="#24292F" stroke-width="1.5"/>
      <rect width="150" height="22" rx="5" fill="#24292F"/>
      <rect y="14" width="150" height="8" fill="#24292F"/>
      <text x="75" y="15" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">GitHub PR #42</text>
      <text x="75" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">gg-push/ephemeral-envs</text>
      <text x="75" y="58" text-anchor="middle" font-size="10" fill="#545B64">head SHA · sticky comment</text>
    </g>

    <line x1="324" y1="80" x2="364" y2="80" stroke="#147EBA" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="344" y="71" text-anchor="middle" font-size="9.5" fill="#147EBA">CI</text>

    <!-- GitHub Actions Frame -->
    <rect x="370" y="18" width="466" height="124" rx="6" fill="#F8FBFE" stroke="#147EBA" stroke-width="1.4"/>
    <rect x="370" y="18" width="236" height="23" rx="4" fill="#147EBA"/>
    <text x="488" y="33" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">GitHub Actions (No Cluster Creds)</text>

    <rect x="386" y="52" width="214" height="76" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="493" y="71" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">CI Gate (ci.yml)</text>
    <text x="493" y="90" text-anchor="middle" font-size="10" fill="#545B64">ruff · pytest · oxlint · npm ci</text>
    <text x="493" y="106" text-anchor="middle" font-size="10" fill="#545B64">kluctl render · kubeconform -strict</text>

    <rect x="614" y="52" width="206" height="76" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="717" y="71" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">Preview Build (pr-preview.yml)</text>
    <text x="717" y="90" text-anchor="middle" font-size="10" fill="#545B64">Buildx + QEMU (amd64 / arm64)</text>
    <text x="717" y="106" text-anchor="middle" font-size="10" fill="#545B64">Scoped GHA cache · non-root</text>

    <line x1="836" y1="80" x2="884" y2="80" stroke="#248814" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="860" y="71" text-anchor="middle" font-size="9.5" fill="#248814">push</text>

    <!-- GHCR Box -->
    <rect x="890" y="28" width="222" height="104" rx="6" fill="#F2F8F0" stroke="#248814" stroke-width="1.5"/>
    <rect x="890" y="28" width="222" height="23" rx="5" fill="#248814"/>
    <rect x="890" y="43" width="222" height="8" fill="#248814"/>
    <text x="1001" y="43" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">GHCR (Public Multi-Arch)</text>
    <text x="1001" y="71" text-anchor="middle" font-size="10" font-weight="700" fill="#232F3E">ephemeral-envs-backend:&lt;sha&gt;</text>
    <text x="1001" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#232F3E">ephemeral-envs-frontend:&lt;sha&gt;</text>
    <text x="1001" y="106" text-anchor="middle" font-size="9.5" fill="#248814">Immutable SHA · linux/amd64,arm64</text>

    <!-- ==================== BOTTOM: K3D CLUSTER ==================== -->
    <rect x="28" y="176" width="1084" height="384" rx="6" fill="#FFFFFF" stroke="#147EBA" stroke-width="1.5"/>
    <rect x="28" y="176" width="320" height="25" rx="4" fill="#147EBA"/>
    <text x="188" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">k3d Cluster (Traefik + kluctl + template-controller)</text>

    <!-- Poll arrow from PR #42 -> ListGithubPullRequests -->
    <path d="M 249 116 V 156 H 366 V 208 H 146 V 230" fill="none" stroke="#0D7D6C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
    <rect x="238" y="148" width="136" height="16" fill="#FFFFFF"/>
    <text x="306" y="160" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0D7D6C">polls open PRs (60s)</text>

    <!-- Control Plane Box (ephemeral-envs-system) -->
    <rect x="46" y="212" width="874" height="114" rx="5" fill="#F4FBF9" stroke="#0D7D6C" stroke-width="1.3"/>
    <text x="60" y="229" font-size="10.5" font-weight="700" fill="#0D7D6C">Namespace: ephemeral-envs-system (Pull-Based Reconciliation Loop · Least-Privilege RBAC)</text>

    <g transform="translate(60,240)">
      <rect width="178" height="72" rx="5" fill="#FFFFFF" stroke="#0D7D6C" stroke-width="1.3"/>
      <text x="89" y="21" text-anchor="middle" font-size="10.5" font-weight="700" fill="#232F3E">ListGithubPullRequests</text>
      <text x="89" y="39" text-anchor="middle" font-size="9.5" fill="#545B64">Polls open PRs every 60s</text>
      <text x="89" y="55" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0D7D6C">head: gg-push:.* (fork guard)</text>
    </g>

    <line x1="238" y1="276" x2="262" y2="276" stroke="#0D7D6C" stroke-width="1.4" marker-end="url(#arr-green)"/>

    <g transform="translate(268,240)">
      <rect width="186" height="72" rx="5" fill="#FFFFFF" stroke="#0D7D6C" stroke-width="1.3"/>
      <text x="93" y="21" text-anchor="middle" font-size="10.5" font-weight="700" fill="#232F3E">ObjectTemplate</text>
      <text x="93" y="39" text-anchor="middle" font-size="9.5" fill="#545B64">prune: true · preview-templater</text>
      <text x="93" y="55" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0D7D6C">48h idle TTL → ConfigMap</text>
    </g>

    <line x1="454" y1="276" x2="478" y2="276" stroke="#0D7D6C" stroke-width="1.4" marker-end="url(#arr-green)"/>

    <g transform="translate(484,240)">
      <rect width="194" height="72" rx="5" fill="#FFFFFF" stroke="#147EBA" stroke-width="1.3"/>
      <text x="97" y="21" text-anchor="middle" font-size="10.5" font-weight="700" fill="#232F3E">KluctlDeployment (pr-42)</text>
      <text x="97" y="39" text-anchor="middle" font-size="9.5" fill="#545B64">preview-deployer (scoped RBAC)</text>
      <text x="97" y="55" text-anchor="middle" font-size="9.5" font-weight="700" fill="#147EBA">prune: true · delete: true</text>
    </g>

    <g transform="translate(698,240)">
      <rect width="208" height="72" rx="5" fill="#FFFFFF" stroke="#545B64" stroke-width="1.2"/>
      <text x="104" y="21" text-anchor="middle" font-size="10.5" font-weight="700" fill="#232F3E">GithubComment</text>
      <text x="104" y="39" text-anchor="middle" font-size="9.5" fill="#545B64">Posts &amp; updates preview URL</text>
      <text x="104" y="55" text-anchor="middle" font-size="9.5" fill="#545B64">pr-closed.yml marks closed</text>
    </g>

    <!-- KluctlDeployment -> Namespace pr-42 -->
    <line x1="581" y1="312" x2="581" y2="340" stroke="#147EBA" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="615" y="331" font-size="9.5" font-weight="700" fill="#147EBA">deploys</text>

    <!-- Preview Namespace Box -->
    <rect x="46" y="346" width="1048" height="198" rx="5" fill="#F8FBFE" stroke="#147EBA" stroke-width="1.4"/>
    <text x="62" y="365" font-size="11" font-weight="700" fill="#147EBA">Namespace: pr-42 (ResourceQuota: 1 CPU / 1 GiB / 5 pods · NetworkPolicy: env-isolation)</text>

    <!-- Users -->
    <g transform="translate(64,414)">
      <rect width="84" height="64" rx="5" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.3"/>
      <circle cx="42" cy="21" r="5" fill="none" stroke="#232F3E" stroke-width="1.6"/>
      <path d="M32 36 c0 -5 4.5 -8 10 -8 s10 3 10 8" fill="none" stroke="#232F3E" stroke-width="1.6" stroke-linecap="round"/>
      <text x="42" y="53" text-anchor="middle" font-size="10.5" font-weight="700" fill="#232F3E">Reviewer</text>
    </g>

    <line x1="148" y1="446" x2="184" y2="446" stroke="#545B64" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="166" y="437" text-anchor="middle" font-size="9.5" fill="#545B64">:80</text>

    <!-- Traefik Ingress -->
    <g transform="translate(190,406)">
      <rect width="206" height="80" rx="5" fill="#F6F2FF" stroke="#7C3AED" stroke-width="1.3"/>
      <text x="103" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">Traefik Ingress</text>
      <text x="103" y="41" text-anchor="middle" font-size="9.5" fill="#7C3AED" font-weight="700">pr-42.local.127.0.0.1.nip.io</text>
      <text x="103" y="59" text-anchor="middle" font-size="9.5" fill="#545B64">/ → frontend · /api → backend</text>
    </g>

    <!-- Split arrows Traefik -> Frontend & Backend -->
    <path d="M 396 432 H 424 V 408 H 446" fill="none" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arr-purple)"/>
    <text x="421" y="401" text-anchor="middle" font-size="9.5" fill="#7C3AED">/</text>

    <path d="M 396 460 H 424 V 492 H 446" fill="none" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arr-purple)"/>
    <text x="421" y="485" text-anchor="middle" font-size="9.5" fill="#7C3AED">/api</text>

    <!-- Frontend -->
    <g transform="translate(452,376)">
      <rect width="248" height="68" rx="5" fill="#FFFFFF" stroke="#147EBA" stroke-width="1.3"/>
      <text x="124" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">Frontend (React + Vite)</text>
      <text x="124" y="38" text-anchor="middle" font-size="9.5" fill="#545B64">nginx-unprivileged:1.27 · :8080 (UID 101)</text>
      <text x="124" y="54" text-anchor="middle" font-size="9.5" fill="#147EBA">RO rootfs · drop ALL · RuntimeDefault</text>
    </g>

    <!-- Backend -->
    <g transform="translate(452,458)">
      <rect width="248" height="68" rx="5" fill="#FFFFFF" stroke="#147EBA" stroke-width="1.3"/>
      <text x="124" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">Backend (FastAPI · Python 3.12)</text>
      <text x="124" y="38" text-anchor="middle" font-size="9.5" fill="#545B64">UID 1000 · :8000 · RO rootfs · XSS-safe</text>
      <text x="124" y="54" text-anchor="middle" font-size="9.5" fill="#147EBA">/api/live (proc) · /api/health (DB 503)</text>
    </g>

    <!-- Backend -> Postgres -->
    <line x1="700" y1="492" x2="748" y2="492" stroke="#545B64" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="724" y="483" text-anchor="middle" font-size="9.5" fill="#545B64">:5432</text>

    <!-- Postgres -->
    <g transform="translate(754,458)">
      <rect width="320" height="68" rx="5" fill="#EEF6FF" stroke="#336791" stroke-width="1.4"/>
      <text x="160" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">Postgres 16 (postgres.pr-42.svc)</text>
      <text x="160" y="38" text-anchor="middle" font-size="9.5" fill="#545B64">postgres:16-alpine · UID/GID 70 · drop ALL</text>
      <text x="160" y="54" text-anchor="middle" font-size="9.5" fill="#336791">emptyDir + seed.sql · isolated via NetworkPolicy</text>
    </g>

    <!-- GHCR -> Frontend & Backend pull path down clear right gutter -->
    <path d="M 1001 132 V 410 H 706" fill="none" stroke="#248814" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
    <path d="M 732 410 V 474 H 706" fill="none" stroke="#248814" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
    <rect x="942" y="268" width="118" height="18" fill="#FFFFFF"/>
    <text x="1001" y="280" text-anchor="middle" font-size="9.5" font-weight="700" fill="#248814">pulls :&lt;sha&gt; images</text>
  </g>
</svg>
