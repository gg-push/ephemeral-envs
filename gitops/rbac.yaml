apiVersion: v1
kind: Namespace
metadata:
  name: ephemeral-envs-system
---
# Used by the ObjectTemplate to read its matrix inputs and to create and prune
# the KluctlDeployment objects it generates. Scoped to those two things, in
# this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-templater
  namespace: ephemeral-envs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-templater
  namespace: ephemeral-envs-system
rules:
  # Read the matrix input. Without this the ObjectTemplate cannot watch
  # ListGithubPullRequests and reports Ready=False with a forbidden error,
  # having generated nothing.
  - apiGroups: ["templates.kluctl.io"]
    resources: ["listgithubpullrequests", "objecttemplates"]
    verbs: ["get", "list", "watch"]
  # Write the generated outputs. Both kinds are generated by the same
  # ObjectTemplate, so both need full access — read-only on githubcomments
  # fails with "cannot patch resource githubcomments".
  - apiGroups: ["templates.kluctl.io"]
    resources: ["githubcomments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gitops.kluctl.io"]
    resources: ["kluctldeployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Expiry markers for pull requests that have gone idle.
  #
  # Every kind the ObjectTemplate can render needs a rule here. There is no
  # partial failure: one missing permission fails the whole reconcile, so a
  # single unlisted kind stops every environment being managed.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-templater
  namespace: ephemeral-envs-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-templater
subjects:
  - kind: ServiceAccount
    name: preview-templater
    namespace: ephemeral-envs-system
---
# Used by each generated KluctlDeployment to actually deploy an environment.
# Scoped strictly to the resource types and verbs a preview environment needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-deployer
  namespace: ephemeral-envs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-deployer
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - services
      - configmaps
      - resourcequotas
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - pods
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # The build-gate hook (deploy/wait-for-images). kluctl recreates it on every
  # deploy, so it needs delete as well as create.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-deployer
subjects:
  - kind: ServiceAccount
    name: preview-deployer
    namespace: ephemeral-envs-system
