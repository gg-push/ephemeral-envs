apiVersion: v1
kind: Namespace
metadata:
  name: ephemeral-envs-system
---
# Used by the ObjectTemplate to read its matrix inputs and to create and prune
# the KluctlDeployment objects it generates. Scoped to those two things, in
# this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-templater
  namespace: ephemeral-envs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-templater
  namespace: ephemeral-envs-system
rules:
  # Read the matrix input. Without this the ObjectTemplate cannot watch
  # ListGithubPullRequests and reports Ready=False with a forbidden error,
  # having generated nothing.
  - apiGroups: ["templates.kluctl.io"]
    resources: ["listgithubpullrequests", "objecttemplates"]
    verbs: ["get", "list", "watch"]
  # Write the generated outputs. Both kinds are generated by the same
  # ObjectTemplate, so both need full access — read-only on githubcomments
  # fails with "cannot patch resource githubcomments".
  - apiGroups: ["templates.kluctl.io"]
    resources: ["githubcomments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gitops.kluctl.io"]
    resources: ["kluctldeployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-templater
  namespace: ephemeral-envs-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-templater
subjects:
  - kind: ServiceAccount
    name: preview-templater
    namespace: ephemeral-envs-system
---
# Used by each generated KluctlDeployment to actually deploy an environment.
# Scoped to the resource types a preview environment is made of rather than
# cluster-admin, so a templating mistake cannot reach the rest of the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-deployer
  namespace: ephemeral-envs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-deployer
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - services
      - configmaps
      - resourcequotas
      - persistentvolumeclaims
      - pods
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-deployer
subjects:
  - kind: ServiceAccount
    name: preview-deployer
    namespace: ephemeral-envs-system
