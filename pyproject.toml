[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["actions-runner", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # The HTML template in app/main.py is intentionally long.
    "E501",
]

[tool.ruff.lint.isort]
# The app runs with its own directory on sys.path (WORKDIR /app), so these are
# first-party despite being bare top-level module names.
known-first-party = ["main", "models", "database"]

[tool.ruff.lint.flake8-bugbear]
# Calling Depends()/Form() in an argument default is the FastAPI idiom, not the
# mutable-default bug B008 is looking for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]
